services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: microservices
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d microservices"]
      interval: 5s
      timeout: 5s
      retries: 20

  user-service:
    build:
      context: ./user-service
    restart: unless-stopped
    environment:
      PORT: 4001
      MONGODB_URI: mongodb://mongo:27017/microservices
      JWT_SECRET: local-compose-secret-change-me
      JWT_EXPIRES_IN: 24h
      GRPC_PORT: 50051
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4001/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  order-service:
    build:
      context: ./order-service
    restart: unless-stopped
    environment:
      PORT: 4002
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/microservices?schema=public
      JWT_SECRET: local-compose-secret-change-me
      USER_GRPC_URL: user-service:50051
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4002/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  api-gateway:
    build:
      context: ./api-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      JWT_SECRET: local-compose-secret-change-me
      USER_SERVICE_URL: http://user-service:4001
      ORDER_SERVICE_URL: http://order-service:4002
    depends_on:
      user-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mongo-data:
  postgres-data:
